<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>09 QR Decoder</title>

  <!-- SEO -->
  <meta name="description" content="09 QR Decoder – Decode QR codes instantly by uploading an image or scanning with your live camera.">
  <meta name="keywords" content="QR Decoder, QR Code Reader, Decode QR, Live Camera QR Scanner">
  <meta name="author" content="SandeepCoder09">

  <!-- Open Graph -->
  <meta property="og:title" content="09 QR Decoder">
  <meta property="og:description" content="Decode QR codes online — upload an image or scan live with your camera.">
  <meta property="og:type" content="website">

  <!-- Theme Color -->
  <meta name="theme-color" content="#0a0a0a">

  <!-- Favicon -->
  <link rel="icon" href="../decoder/asstes/qr-logo-brand-09.png" type="image/png">
  <link rel="apple-touch-icon" href="../decoder/asstes/qr-logo-brand-09.png">

  <!-- Shared CSS -->
  <link rel="stylesheet" href="../generator/style.css">

  <!-- jsQR — QR decoding library -->
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
</head>

<body>

  <!-- Theme toggle (icon rendered via CSS mask-image) -->
  <button id="themeToggle" class="toggle-btn" aria-label="Switch to light theme"></button>

  <h1 class="main-title">09 QR Decoder</h1>

  <main class="card">

    <!-- File upload -->
    <label class="file-label">
      <span>Select QR Image</span>
      <input type="file" id="qrImage" accept="image/*">
    </label>

    <!-- Hidden decode canvas -->
    <canvas id="decodeCanvas" style="display:none;"></canvas>

    <!-- Spinner (shown while decoding) -->
    <div class="spinner" id="decodeSpinner"></div>

    <!-- Decoded result box -->
    <div class="decoded-box">
      <label class="decoded-title">Decoded Result</label>
      <p id="decodedText">Upload a QR image or scan with camera…</p>
    </div>

    <!-- Copy button (SVG icon injected by JS, hidden until decoded) -->
    <button id="copyBtn" class="btn-secondary">Copy Text</button>

    <!-- Camera scan button (SVG icon injected by JS) -->
    <button id="startScanBtn" class="btn">Scan with Camera</button>

    <!-- Camera wrapper + scan badge injected here by script.js -->

    <!-- Page navigation (SVG icon injected by JS) -->
    <a href="../generator/index.html" class="switch-page">Back to Generator</a>

  </main>

  <!-- Branding Footer -->
  <footer class="site-footer">
    <div class="footer-brand">
    </div>
    <p class="footer-tagline">QR GenDecoder &mdash; Generate &amp; Decode QR codes instantly</p>
    <nav class="footer-links" aria-label="Footer navigation">
      <a href="../generator/index.html">Generator</a>
      <span class="sep">&bull;</span>
      <a href="../decoder/index.html">Decoder</a>
      <span class="sep">&bull;</span>
    </nav>
    <p class="footer-copy">&copy; <span id="footerYear"></span> Sandy Coder . All rights reserved.</p>
  </footer>

  <script src="../generator/script.js"></script>
  <script>document.getElementById('footerYear').textContent = new Date().getFullYear();</script>

</body>
</html>
